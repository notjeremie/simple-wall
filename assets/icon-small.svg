<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2433"/>
      <stop offset="1" stop-color="#0C0E14"/>
    </linearGradient>
    <linearGradient id="led" gradientUnits="userSpaceOnUse" x1="14" y1="0" x2="242" y2="0">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="0.5" stop-color="#FF2F7A"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2F7A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF2F7A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="url(#bg)"/>
  
  <!-- left return, front face, right return -->
  <polygon points="14,98 66,82 66,174 14,158" fill="url(#led)"/>
  <polygon points="14,98 66,82 66,174 14,158" fill="#000" opacity="0.40"/>
  <rect x="66" y="82" width="124" height="92" fill="url(#led)"/>
  <polygon points="190,82 242,98 242,158 190,174" fill="url(#led)"/>
  <polygon points="190,82 242,98 242,158 190,174" fill="#000" opacity="0.40"/>
  <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4">
    <line x1="66" y1="82" x2="66" y2="174"/>
    <line x1="190" y1="82" x2="190" y2="174"/>
  </g>
</svg>
